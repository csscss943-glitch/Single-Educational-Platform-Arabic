رقية"],correct:"استخدام الهاتف أثناء المشي مما يسبب حوادث",explanation:"من مخاطر الهاتف: الانشغال به أثناء المشي أو قيادة الدراجة يسبب حوادث."},{id:"u1-m22",question:"من أمور يجب مراعاتها عند النشر: احترام حقوق المؤلف يعني:",options:["عدم نسخ محتوى بدون ذكر المصدر والإذن","نسخ أي شيء مجاناً","حذف اسم المؤلف","نشر كتب مدفوعة مجاناً"],correct:"عدم نسخ محتوى بدون ذكر المصدر والإذن",explanation:"حقوق المؤلف تحمي الإبداع، يجب الاستئذان وذكر المصدر."}],essay:[{id:"u1-e1",question:"ما الفرق بين البيانات والمعلومات والمعرفة؟ اذكر مثالاً من الكتاب (درجة حرارة، رطوبة، تنبؤ طقس).",hint:"البيانات خام، المعلومات معالجة، المعرفة خبرة وتطبيق",modelAnswer:`البيانات: حقائق خام مثل 25°، 70% رطوبة. 
المعلومات: بعد المعالجة مثل 'الطقس غداً 25° مع رطوبة 70% واحتمال مطر'. 
المعرفة: فهم وتطبيق مثل 'بما أن الرطوبة عالية والحرارة منخفضة، أنصح بأخذ مظلة وارتداء ملابس ثقيلة'. المعرفة تنتج عن تراكم المعلومات والخبرة.`},{id:"u1-e2",question:"ما الفرق بين المعلومات الأولية والثانوية والتحقق المتبادل؟ اذكر مثالاً لكل نوع.",hint:"فكر في مصدر الحصول على المعلومة",modelAnswer:`المعلومات الأولية: تجمعها بنفسك مباشرة عبر التجربة أو الملاحظة أو المقابلة. مثال: قياسك درجة حرارة الفصل بنفسك.
الثانوية: تحصل عليها من طرف ثالث جمعها سابقاً مثل الكتب والتقارير. مثال: قراءة تقرير الأرصاد من موقع رسمي.
التحقق المتبادل: مقارنة نفس المعلومة من مصادر مستقلة للتأكد من صحتها. مثال: مقارنة خبر من 3 صحف مختلفة قبل تصديقه.`},{id:"u1-e3",question:"عرف الثقافة الإعلامية وأهميتها للطالب؟",modelAnswer:`الثقافة الإعلامية هي القدرة على الوصول إلى المعلومات من الوسائط المختلفة، وتحليلها، وتقييمها، وتفسيرها بدقة، وإنشاء محتوى إعلامي مسؤول.
أهميتها: التمييز بين الصحيح والمضلل، فهم أهداف الرسائل الإعلامية والدعاية، اتخاذ قرارات واعية، عدم الوقوع ضحية للشائعات.`},{id:"u1-e4",question:"اذكر 6 أمور يجب مراعاتها عند نشر المعلومات على الإنترنت حسب الكتاب؟",modelAnswer:`1- عدم مشاركة صور أو معلومات عن الآخرين بدون إذنهم.
2- عدم تسريب المعلومات الشخصية الخاصة.
3- احترام حقوق المؤلف والملكية الفكرية.
4- احترام خصوصية الآخرين.
5- عدم التنمر الإلكتروني أو نشر تعليقات مسيئة.
6- التأكد من صحة المعلومات قبل نشرها لتجنب الشائعات.
7- الانتباه للعلامة الجغرافية Geotagging قبل النشر.`},{id:"u1-e5",question:"ما هي مخاطر العلامة الجغرافية Geotagging وسيناريو نشر صورة من المنزل؟",modelAnswer:"Geotagging يضيف خط الطول والعرض للصور تلقائياً. الخطر: إذا نشرت صورة من منزلك، يمكن لأي شخص استخراج الإحداثيات ومعرفة عنوان بيتك بدقة، مما يعرضك للسرقة أو التتبع. الحل: إيقاف خاصية الموقع في الكاميرا قبل التصوير، أو إزالة البيانات الوصفية قبل النشر."}]},{id:2,title:"الوحدة الثانية: حماية البيانات الشخصية والحقوق الرقمية",short:"الوحدة الثانية",description:"البيانات الشخصية - أنواعها - الحقوق - أنظمة الموافقة - سيناريوهات من الكتاب",mcq:[{id:"u2-m1",question:"ما تعريف البيانات الشخصية حسب قانون حماية البيانات؟",options:["أي معلومات تحدد هوية الشخص مباشرة أو غير مباشرة","الاسم فقط","رقم الهاتف فقط","الصور فقط"],correct:"أي معلومات تحدد هوية الشخص مباشرة أو غير مباشرة",explanation:"البيانات الشخصية هي كل ما يمكن أن يحدد هوية فرد بشكل مباشر مثل الاسم أو غير مباشر مثل جمع بيانات متعددة."},{id:"u2-m2",question:"أي مما يلي يعتبر من البيانات الشخصية التي يجب حمايتها؟",options:["البريد الإلكتروني","بصمة الإصبع","رقم جواز السفر","كل ما سبق"],correct:"كل ما سبق",explanation:"كلها بيانات تحدد الهوية."},{id:"u2-m3",question:"الاسم والعنوان وتاريخ الميلاد والجنس ورقم الهاتف تعتبر من:",options:["البيانات الأساسية Basic data","أرقام الهوية","البيانات الحساسة","بيانات الموقع"],correct:"البيانات الأساسية Basic data",explanation:"البيانات الأساسية هي المعلومات العامة الأولية التي تحدد هوية الشخص."},{id:"u2-m4",question:"الرقم القومي ورقم جواز السفر ورقم رخصة القيادة تعتبر من:",options:["البيانات الأساسية","أرقام الهوية الشخصية ID numbers","البيانات المالية","البيانات الصحية"],correct:"أرقام الهوية الشخصية ID numbers",explanation:"أرقام فريدة تصدرها جهات رسمية لتحديد هوية الفرد بدقة."},{id:"u2-m5",question:"العرق والديانة والآراء السياسية والانتماء النقابي تعتبر من:",options:["البيانات العامة","بيانات حساسة تتطلب رعاية خاصة Sensitive","البيانات الأساسية","بيانات مفتوحة"],correct:"بيانات حساسة تتطلب رعاية خاصة Sensitive",explanat يحمي المصالح الاقتصادية للمشاهير من استخدام صورتهم أو اسمهم تجارياً؟",options:["حق الصورة","حقوق الدعاية Publicity Rights","حق المؤلف","حق براءة الاختراع"],correct:"حقوق الدعاية Publicity Rights",explanation:"حقوق الدعاية تحمي القيمة الاقتصادية لاسم وصورة المشاهير."},{id:"u2-m13",question:"هل يجوز نشر صورة جماعية للفصل على الإنترنت بدون إذن الجميع؟",options:["لا، يجب الحصول على إذن جميع الظاهرين في الصورة","نعم بدون إذن","نعم إذا كانت جميلة","نعم إذا كانوا أصدقاء"],correct:"لا، يجب الحصول على إذن جميع الظاهرين في الصورة",explanation:"حق الصورة يتطلب موافقة كل شخص ظاهر، حتى الصورة الجماعية."},{id:"u2-m14",question:"هل يجوز بيع تيشيرت عليه صورة ممثل مشهور بدون إذنه؟",options:["لا، ينتهك حقوق الدعاية Publicity Rights","نعم مسموح","نعم إذا كان رخيصاً","نعم إذا كان قديماً"],correct:"لا، ينتهك حقوق الدعاية Publicity Rights",explanation:"استخدام صورة مشهور تجارياً بدون إذن ينتهك حقوق الدعاية."},{id:"u2-m15",question:"ما هو النظام الذي يشترط الحصول على موافقة صريحة ومسبقة قبل جمع البيانات؟",options:["نظام الموافقة المسبقة Opt-in","نظام الاعتراض Opt-out","النظام المفتوح","نظام المشاركة"],correct:"نظام الموافقة المسبقة Opt-in",explanation:"Opt-in: لا يجوز جمع البيانات إلا بعد موافقة صريحة."},{id:"u2-m16",question:"ما هو النظام الذي يسمح بمعالجة البيانات ما لم يعترض صاحبها صراحة؟",options:["نظام الموافقة المسبقة","نظام الاعتراض Opt-out","نظام الحظر الكامل","نظام التفويض"],correct:"نظام الاعتراض Opt-out",explanation:"Opt-out: يسمح مبدئياً لكن يجب التوقف فور اعتراض صاحب البيانات."},{id:"u2-m17",question:"ما المقصود بسياسة الخصوصية Privacy Policy؟",options:["وثيقة توضح كيف تجمع الشركة البيانات وتستخدمها وتحميها","إعلان تجاري","كلمة مرور","برنامج حماية"],correct:"وثيقة توضح كيف تجمع الشركة البيانات وتستخدمها وتحميها",explanation:"سياسة الخصوصية توضح للمستخدم حقوقه وكيف تتعامل الشركة مع بياناته."},{id:"u2-m18",question:"ما المقصود بالترخيص License في البرمجيات؟",options:["اتفاق يحدد شروط استخدام البرنامج وحقوق المستخدم","حذف البرنامج","شراء جهاز جديد","كلمة مرور"],correct:"اتفاق يحدد شروط استخدام البرنامج وحقوق المستخدم",explanation:"الترخيص يحدد ما يجوز وما لا يجوز للمستخدم فعله بالبرنامج."}],essay:[{id:"u2-e1",question:"ما هو قانون حماية البيانات الشخصية؟ ومتى يجوز جمع البيانات بدون موافقة صاحبها؟ اذكر 5 حالات.",modelAnswer:`قانون يحدد قواعد جمع ومعالجة وتخزين ونقل البيانات الشخصية لحماية الخصوصية.
يجوز بدون موافقة إذا:
1- مستند لنص قانوني.
2- ضروري لحماية الأمن القومي أو النظام العام.
3- ضروري لحماية حياة شخص (طوارئ).
4- تنفيذ حكم قضائي أو أمر جهة تحقيق.
5- ضروري لإتمام عقد طرفه صاحب البيانات.
6- البيانات متاحة علناً من صاحبها.`},{id:"u2-e2",question:"وضح الفرق بين حق الصورة وحقوق الدعاية مع مثال لكل منهما؟",modelAnswer:`حق الصورة: حق أي شخص في منع تصويره أو نشر صورته بدون إذن، حماية للكرامة والخصوصية. مثال: لا يجوز نشر صورة زميلك في رحلة بدون إذنه.
حقوق الدعاية: حق المشاهير في حماية القيمة الاقتصادية لاسمهم وصورتهم من الاستغلال التجاري. مثال: لا يجوز طباعة صورة لاعب مشهور على تيشيرت وبيعه بدون عقد ومقابل.`},{id:"u2-e3",question:"ما الفرق بين نظام الموافقة المسبقة Opt-in ونظام الاعتراض Opt-out؟",modelAnswer:`Opt-in (الموافقة المسبقة): لا يجوز جمع أو معالجة البيانات إلا بعد موافقة صريحة ومسبقة من صاحبها. أكثر حماية للخصوصية.
Opt-out (الاعتراض): يسمح بجمع البيانات مبدئياً، لكن يجب التوقف فور اعتراض صاحب البيانات وطلبه الحذف. أقل حماية لكنه شائع في التسويق.`},{id:"u2-e4",question:"سيناريو: هل يجوز نشر صورة جماعية لحفل تخرج على إنستجرام بدون إذن؟ وماذا عن بيع مج عليه صورة مغني مشهور؟",modelAnswer:`الصورة الجماعية: لا يجوز بدون إذن جميع الأشخاص الظاهرين، لأن لكل واحد حق صورة مستقل، حتى لو صورة جماعية. يجب الاستئذان.
المج بصورة مغني: لا يجوز، ينتهك حقوق الدعاية، لأن صورة المغني لها قيمة اقتصادية وتحتاج ترخيص تجاري وعقد ودفع مقابل، حتى لو الصورة من الإنترنت.`}]},{id:3,title:"الوحدة الثالثة: أمن المعلومات والتهديدات الرقمية",short:"الوحدة الثالثة",description:"أمن المعلومات - التهديدات - التشفير - التوقيع الرقمي - SSL/TLS - سياسة الأمان",mcq:[{id:"u3-m1",question:"ما هو تعريف أمن المعلومات؟",options:["حماية المعلومات من الوصول غير المصرح به والتعديل والتخريب وضمان سريتها وسلامتها وتوافرها","حذف المعلومات","نشر المعلومات للجميع","ضغط المعلومات فقط"],correct:"حماية المعلومات من الوصول غير المصرح به والتعديل والتخريب وضمان سريتها وسلامتها وتوافرها",explanation:"أمن المعلومات يضمن CIA: السرية Confidentiality، السلامة Integrity، التوافر Availability."},{id:"u3-m2",question:"ما المقصود بكلمات المرور الضعيفة كتهديد؟",options:["كلمة سهلة التخمين تسمح باختراق الحساب","كلمة قوية","كلمة طويلة","كلمة مشفرة"],correct:"كلمة سهلة التخمين تسمح باختراق الحساب",explanation:"مثل 123456 أو تاريخ ميلادك، سهلة الاختراق."},{id:"u3-m3",question:"ما هو الاحتيال عبر الفواتير والتصيد Phishing؟",options:["رسائل خادعة تطلب بياناتك عبر انتحال شركة أو بنك","فاتورة صحيحة","رسالة من صديق","إعلان عادي"],correct:"رسائل خادعة تطلب بياناتك عبر انتحال شركة أو بنك",explanation:"مثل رسالة 'فاتورتك غير مدفوعة اضغط هنا' تسرق بياناتك."},{id:"u3-m4",question:"ما هو الوصول غير المصرح به للمعلومات؟",options:["دخول شخص غير مخول لنظام أو بيانات","دخول صاحب الحساب","تسجيل خروج","تحديث برنامج"],correct:"دخول شخص غير مخول لنظام أو بيانات",explanation:"يحدث عند ضعف الصلاحيات أو عدم وجود مصادقة قوية."},{id:"u3-m5",question:"ما هي سياسة أمن المعلومات؟",options:["وثيقة تحدد قواعد وإجراءات حماية معلومات المؤسسة","قصة قصيرة","برنامج ألعاب","متصفح إنترنت"],correct:"وثيقة تحدد قواعد وإجراءات حماية معلومات المؤسسة",explanation:"السياسة تحدد من يدخل، كيف، وماذا يفعل، وإجراءات الطوارئ."},{id:"u3-m6",question:"ما هو المقصود بعملية التشفير Encryption؟",options:["تحويل المعلومات إلى شكل غير مفهوم إلا بمفتاح","حذف المعلومات نهائياً","نسخ المعلومات احتياطياً","ضغط المعلومات لتوفير المساحة"],correct:"تحويل المعلومات إلى شكل غير مفهوم إلا بمفتاح",explanation:"التشفير يحمي السرية."},{id:"u3-m7",question:"ما هي أنواع التشفير الأساسية؟",options:["تشفير متماثل بمفتاح واحد وتشفير غير متماثل بمفتاحين عام وخاص","تشفير ورقي فقط","لا يوجد أنواع","تشفير بالصوت فقط"],correct:"تشفير متماثل بمفتاح واحد وتشفير غير متماثل بمفتاحين عام وخاص",explanation:"المتماثل سريع لكن يحتاج تبادل مفتاح آمن، غير المتماثل يستخدم مفتاح عام للتشفير وخاص لفك التشفير."},{id:"u3-m8",question:"ما هي وظيفة التوقيع الرقمي Digital Signature؟",options:["يثبت هوية المرسل ويضمن عدم التلاعب بالرسالة","يزيد سرعة الإنترنت","يضغط الملفات","يحذف الفيروسات"],correct:"يثبت هوية المرسل ويضمن عدم التلاعب بالرسالة",explanation:"مثل التوقيع اليدوي لكن رقمياً، يضمن الأصالة والسلامة."},{id:"u3-m9",question:"ما هو SSL/TLS؟",options:["بروتوكول لتشفير الاتصال بين المتصفح والخادم لحماية البيانات أثناء النقل","برنامج تصميم","لغة برمجة","نوع من الفيروسات"],correct:"بروتوكول لتشفير الاتصال بين المتصفح والخادم لحماية البيانات أثناء النقل",explanation:"يظهر كـ https وقفل في المتصفح، يحمي كلمات المرور وبطاقات الدفع."},{id:"u3-m10",question:"لماذا نستخدم HTTPS بدلاً من HTTP؟",options:["لأن HTTPS مشفر بـ SSL/TLS يحمي البيانات","لأنه أسرع","لا فرق","لأنه مجاني"],correct:"لأن HTTPS مشفر بـ SSL/TLS يحمي البيانات",explanation:"HTTP يرسل البيانات واضحة، HTTPS يشفرها."},{id:"u3-m11",question:"ما أفضل طريقة لإنشاء كلمة مرور قوية؟",options:["حروف كبيرة وصغيرة وأرقام ورموز طويلة 12+ وتفعيل التحقق بخطوتين","123456","اسمك فقط","تاريخ ميلادك"],correct:"حروف كبيرة وصغيرة وأرقام ورموز طويلة 12+ وتفعيل التحقق بخطوتين",explanation:"القوة في الطول والتنوع والتحقق بخطوتين."},{id:"u3-m12",question:"ما المقصود بالجريمة الإلكترونية Cybercrime؟",options:["استخدام الحاسوب والإنترنت لارتكاب جرائم مثل الاحتيال ونشر الفيروسات وسرقة الهوية","استخدام الحاسوب للدراسة","تصفح آمن","برمجة مفيدة"],correct:"استخدام الحاسوب والإنترنت لارتكاب جرائم مثل الاحتيال ونشر الفيروسات وسرقة الهوية",explanation:"تشمل الابتزاز، التصيد، برامج الفدية، انتحال الشخصية."},{id:"u3-m13",question:"ما هو تسريب المعلومات الشخصية؟",options:["خروج بيانات خاصة بدون إذن بسبب إهمال أو اختراق","نشر معلومات عامة","حذف بيانات","ضغط بيانات"],correct:"خروج بيانات خاصة بدون إذن بسبب إهمال أو اختراق",explanation:"مثل تسريب أرقام بطاقات العملاء من شركة بسبب ضعف الحماية."},{id:"u3-m14",question:"ما هو انتحال الهوية Identity Theft؟",options:["استخدام بيانات شخص آخر للاحتيال وانتحال شخصيته","استخدام اسمك الحقيقي","إنشاء حساب جديد باسمك","نسيان كلمة المرور"],correct:"استخدام بيانات شخص آخر للاحتيال وانتحال شخصيته",explanation:"مثل استخدام بطاقة شخص آخر للشراء أو فتح حساب باسمه."}],essay:[{id:"u3-e1",question:"اذكر 4 تهديدات لأمن المعلومات وكيفية الحماية منها؟",modelAnswer:`1- كلمات المرور الضعيفة: الحماية بكلمة قوية + تحقق بخطوتين.
2- الاحتيال والتصيد عبر الفواتير: عدم فتح روابط مشبوهة، التأكد من عنوان المرسل.

يطة العالم أو خريطة المترو","قاموس","تقويم","قائمة أسعار مرتبة من الأغلى للأرخص"],correct:"خريطة العالم أو خريطة المترو",explanation:"Location = حسب المكان."},{id:"u6-m25",question:"ما هي الواجهة التي تعتمد على كتابة أوامر نصية؟",options:["واجهة الأوامر النصية CUI","واجهة المستخدم الرسومية GUI","واجهة اللمس","واجهة الصوت"],correct:"واجهة الأوامر النصية CUI",explanation:"CUI مثل CMD."},{id:"u6-m26",question:"ما هي الواجهة التي تعتمد على الأيقونات والقوائم والنوافذ؟",options:["واجهة الأوامر النصية CUI","واجهة المستخدم الرسومية GUI","واجهة الآلة","واجهة الشبكة"],correct:"واجهة المستخدم الرسومية GUI",explanation:"GUI سهلة بدون حفظ أوامر."},{id:"u6-m27",question:"ما هي VUI و NUI؟",options:["VUI واجهة صوتية مثل سيري، NUI واجهة طبيعية مثل اللمس والإيماءات","نفس GUI","لا وجود لها","واجهات ورقية"],correct:"VUI واجهة صوتية مثل سيري، NUI واجهة طبيعية مثل اللمس والإيماءات",explanation:"VUI Voice, NUI Natural."},{id:"u6-m28",question:"ما هو UX؟",options:["تجربة المستخدم User Experience الشعور العام عند استخدام المنتج","لغة برمجة","نوع حاسوب","كابل"],correct:"تجربة المستخدم User Experience الشعور العام عند استخدام المنتج",explanation:"UX تشمل السهولة والرضا والكفاءة."},{id:"u6-m29",question:"ما هو Affordance؟",options:["الإجراء الممكن الذي يوحي به تصميم الشيء مثل زر بارز يوحي بالضغط","لون فقط","صوت فقط","لا شيء"],correct:"الإجراء الممكن الذي يوحي به تصميم الشيء مثل زر بارز يوحي بالضغط",explanation:"Affordance هو إمكانية الفعل."},{id:"u6-m30",question:"ما هو Signifier؟",options:["علامة توضح كيفية استخدام الإمكانية مثل كلمة ادفع على الزر","زر بدون كتابة","صوت بدون معنى","لون عشوائي"],correct:"علامة توضح كيفية استخدام الإمكانية مثل كلمة ادفع على الزر",explanation:"Signifier يوضح Affordance."},{id:"u6-m31",question:"ما هو Usability؟",options:["مدى سهولة وكفاءة استخدام المنتج لتحقيق الهدف","صعوبة الاستخدام","لون المنتج","سعر المنتج"],correct:"مدى سهولة وكفاءة استخدام المنتج لتحقيق الهدف",explanation:"Usability تقاس بسرعة إنجاز المهمة وقلة الأخطاء."},{id:"u6-m32",question:"ما هو Accessibility و Universal Design؟",options:["تصميم يمكن للجميع استخدامه بما في ذلك ذوي الاحتياجات الخاصة","تصميم لفئة واحدة فقط","تصميم معقد","تصميم بدون ألوان"],correct:"تصميم يمكن للجميع استخدامه بما في ذلك ذوي الاحتياجات الخاصة",explanation:"Universal Design يراعي الجميع: كبار سن، إعاقات، لغات مختلفة."}],essay:[{id:"u6-e1",question:"ما الفرق بين Affordance و Signifier و Usability؟ وضح بمثال لكل مصطلح.",modelAnswer:`Affordance (الإمكانية): الإجراء الممكن الذي يوحي به التصميم. مثال: زر بارز يوحي بأنه قابل للضغط، مقبض باب يوحي بالسحب.
Signifier (المؤشر): العلامة التي توضح كيفية الاستخدام. مثال: كلمة 'ادفع' أو سهم على الزر.
Usability (قابلية الاستخدام): مدى سهولة وكفاءة استخدام المنتج. مثال: موقع يتم الشراء فيه ب3 نقرات فقط فهو سهل الاستخدام.
العلاقة: Affordance موجودة بطبيعة التصميم، Signifier يوضحها، و Usability تقيس نجاح الاثنين.`},{id:"u6-e2",question:"اشرح نظام LATCH لتنظيم المعلومات مع ذكر مثال لكل طريقة؟",modelAnswer:`LATCH وضعه ريتشارد سول ورمان:
L - Location (الموقع): حسب المكان. مثال: خريطة العالم، خريطة مترو.
A - Alphabet (أبجدي): حسب الحروف. مثال: القاموس، دليل الهاتف.
T - Time (الزمن): حسب التسلسل الزمني. مثال: جدول الحصص، التقويم، تاريخ الأحداث.
C - Category (الفئة): حسب النوع. مثال: تصنيف الكتب علمي/أدبي، تصنيف منتجات متجر.
H - Hierarchy (هرمي): حسب الأهمية أو الحجم. مثال: ترتيب موظفين حسب الرتبة، أسعار من الأغلى للأرخص، مجلدات متداخلة.`},{id:"u6-e3",question:"اشرح الفرق بين الأنظمة العشرية والثنائية والسداسية عشرية مع مثال تحويل؟",modelAnswer:`عشري Decimal أساس 10 (0-9) نستخدمه يومياً.
ثنائي Binary أساس 2 (0,1) لغة الحاسوب.
سداسي عشر Hex أساس 16 (0-9,A-F) اختصار للثنائي.
تحويل: عشري 26 => ثنائي 11010 (16+8+0+2+0). ثنائي 1101 => عشري 13 (8+4+0+1). سداسي A=10, F=15. ثنائي 1010 1100 = BC سداسي (1010=B? لا، 1010=A، 1100=C) => AC.`},{id:"u6-e4",question:"اشرح كيف يتم تمثيل الحروف والأعداد السالبة في الحاسوب؟",modelAnswer:`الحروف: كل حرف يعطى رقم. ASCII 7بت 128 حرف إنجليزي. Unicode مثل UTF-8 يدعم كل اللغات (عربي، صيني) بآلاف الرموز.
الأعداد السالبة: باستخدام المتمم. المتمم الأحادي One's: قلب البتات. المتمم الثنائي Two's: قلب +1. مثال -5 في 4 بت: 5=0101، متمم أحادي 1010، ثنائي 1011 يمثل -5. الطرح A-B = A + متمم B.`},{id:"u6-e5",question:"اشرح رقمنة الصوت والصورة والفيديو والعوامل المؤثرة على حجمها؟",modelAnswer:`صوت: موجة تماثلية -> أخذ عينات Sampling بمعدل مثل 44100Hz -> تكميم Quantization (مثل 16بت) -> ترميز. الحجم = معدل العينات * عدد البتات * قنوات * مدة.
صورة: تقسيم لشبكة بكسلات Pixels، كل بكسل لون RGB 3 بايت. الحجم = عرض*ارتفاع*عمق لون. مثال 1920x1080*3 بايت.
فيديو: صور متتالية 30fps + صوت. حجمه ضخم لذا نحتاج ضغط. مثل فيلم ساعة 1080p بدون ضغط عشرات الجيجابايت، مع ضغط H.264 يصبح 1-2 جيجا.`},{id:"u6-e6",question:"ما الفرق بين الضغط بدون فقدان Lossless وبفقدان Lossy؟ اذكر أمثلة ومتى نستخدم كل نوع؟",modelAnswer:`Lossless بدون فقدان: يعيد البيانات 100%، نسبة ضغط أقل. أمثلة: ZIP, RAR, PNG, FLAC. يستخدم للنصوص، البرامج، الصور التي تحتاج دقة كاملة (شعارات، مخططات).
